<!doctype html>
<html lang="it">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who owns the internet? · Globe</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#090A18;color:white;font-family:Arial,sans-serif}#map{position:absolute;inset:0}header{position:absolute;top:34px;left:40px;pointer-events:none}h1{font-size:clamp(25px,3.3vw,52px);margin:8px 0;color:#efb3f4;letter-spacing:-1.5px}p,.eyebrow{font:11px monospace;letter-spacing:1px;color:#a4a7c0}.eyebrow{color:#d5b7de}#legend{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);width:max-content;max-width:94%;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:#090a18e8;padding:14px;border:1px solid #292a40;border-radius:12px}button{font:11px monospace;color:#fff;background:#111324;border:1px solid #30344f;border-radius:5px;padding:10px;cursor:pointer}button[aria-pressed=false]{opacity:.38}button:focus-visible{outline:2px solid #efb3f4}i{display:inline-block;width:22px;border-top:2px solid var(--color);vertical-align:middle;margin-right:7px}#controls{position:absolute;left:40px;top:148px;display:flex;gap:8px}#status{position:absolute;left:40px;bottom:12px;font:10px monospace;color:#a4a7c0}.maplibregl-popup-content{background:#141628;color:white;border:1px solid #30344f;padding:18px;font:12px/1.6 monospace;max-width:300px}.maplibregl-popup-close-button{color:white}.maplibregl-ctrl-attrib{font-size:10px}@media(max-width:650px){header{left:18px;top:18px}#controls{left:18px;top:118px}#legend{bottom:46px;padding:8px;gap:4px}button{font-size:10px;padding:8px}#status{left:18px;bottom:26px}}
</style>
<div id="map" aria-label="Globo interattivo dei cavi sottomarini"></div>
<header><span class="eyebrow">MAPPING SYSTEMS / 2026</span><h1>WHO OWNS THE INTERNET?</h1><p>Trascina per esplorare · Scorri per zoomare · Clicca un cavo</p></header>
<div id="controls"><button id="rotate" aria-pressed="false">Rotazione</button><button id="reset">Vista iniziale</button><button id="flat" aria-pressed="false">Mappa piana</button></div>
<div id="legend" aria-label="Filtri della mappa"></div><div id="status" role="status">Caricamento del globo…</div>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script><script src="data.js"></script><script src="globe.js"></script>
</html>
